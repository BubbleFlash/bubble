name: Test environment

on:
  push:
    branches:
      - develop
      - feature/test-server-config
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: test-deploy
  cancel-in-progress: true

jobs:
  verify:
    name: Verify project
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  publish:
    name: Build and publish images
    runs-on: ubuntu-latest
    needs: verify

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/test-bubble-api:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/test-bubble-api:develop
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build and push Realtime
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/realtime/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/test-bubble-realtime:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/test-bubble-realtime:develop
          cache-from: type=gha,scope=realtime
          cache-to: type=gha,mode=max,scope=realtime

      - name: Build and push Web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/test-bubble-web:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/test-bubble-web:develop
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
