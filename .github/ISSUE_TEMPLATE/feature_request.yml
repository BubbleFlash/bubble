name: Задача
description: Предложить новую функциональность или улучшение
title: "feat: "
labels: [feature]

body:
  - type: textarea
    id: description
    attributes:
      label: Описание
      description: Что необходимо реализовать и зачем?
      placeholder: |
        Описать требуемую функциональность,
        текущую проблему или причину изменения.

  - type: textarea
    id: expected
    attributes:
      label: Ожидаемый результат
      description: Как должно работать после реализации?
      placeholder: |
        Описать ожидаемое поведение системы.

  - type: textarea
    id: additional
    attributes:
      label: Дополнительная информация
      description: Технические детали, ограничения, ссылки и другие важные сведения.
