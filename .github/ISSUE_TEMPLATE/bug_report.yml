name: Баг
description: Сообщить о проблеме или неправильной работе приложения
title: "bug: "
labels: [bug]

body:
  - type: markdown
    attributes:
      value: |
        Опишите проблему настолько подробно, насколько можете.

        Не публикуйте пароли, токены, содержимое `.env` и другие секретные данные.

        Если обнаружили уязвимость безопасности, сообщите о ней приватным способом, а не через эту форму.

  - type: textarea
    id: description
    attributes:
      label: Описание проблемы
      description: |
        Что произошло и как, по вашему мнению, должно было работать?
      placeholder: |
        Например: при попытке войти в аккаунт появляется ошибка,
        хотя логин и пароль указаны правильно.

  - type: textarea
    id: steps
    attributes:
      label: Как воспроизвести
      description: Если знаете, опишите последовательность действий, приводящую к ошибке.
      placeholder: |
        1. Открыть страницу ...
        2. Нажать ...
        3. Увидеть ошибку ...

  - type: textarea
    id: additional
    attributes:
      label: Дополнительная информация
      description: |
        Здесь можно указать браузер, устройство, операционную систему,
        текст ошибки, логи и приложить скриншоты.
      placeholder: |
        Браузер и версия:
        Устройство и ОС:
        Текст ошибки:
        Дополнительные сведения:
