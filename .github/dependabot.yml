version: 2

# Одна общая группа обновлений для всех экосистем.
multi-ecosystem-groups:
  all-dependencies:
    schedule:
      interval: weekly
    labels:
      - dependencies
    commit-message:
      prefix: "chore(deps)"

updates:
  # npm-зависимости
  - package-ecosystem: npm
    directory: /
    patterns:
      - "*"
    multi-ecosystem-group: all-dependencies

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    patterns:
      - "*"
    multi-ecosystem-group: all-dependencies
