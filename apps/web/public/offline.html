<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>Нет подключения · Bubble</title>
    <link rel="icon" type="image/png" href="/favicon-v3.png" />
    <style>
      :root {
        --bg: #f6f5f1;
        --text: #1c1b18;
        --muted: #6f6c64;
        --accent: #1f6f5c;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #141412;
          --text: #efede6;
          --muted: #9a978d;
          --accent: #4fb89c;
        }
      }
      body {
        box-sizing: border-box;
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--bg);
        color: var(--text);
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        text-align: center;
      }
      img {
        width: 72px;
        height: 72px;
      }
      h1 {
        font-size: 22px;
        margin: 16px 0 8px;
      }
      p {
        color: var(--muted);
        margin: 0 0 20px;
      }
      a { color: var(--accent); }
      button + p { margin-top: 16px; }
      button {
        padding: 10px 20px;
        border: 0;
        border-radius: 10px;
        background: var(--accent);
        color: #fff;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192-v3.png" alt="" />
      <h1>Нет подключения</h1>
      <p>Подключитесь к интернету и обновите страницу.</p>
      <button onclick="location.reload()">Повторить</button>
      <p><a href="https://t.me/+4NVWfxlDRps4ODhi" target="_blank" rel="noopener noreferrer">Bubble в Telegram</a></p>
    </main>
  </body>
</html>
